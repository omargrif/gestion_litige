<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Supabase schema">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .title { font: 700 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #e5e7eb; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.2; }
      .head { fill: #0f172a; }
      .htext { font: 700 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #e5e7eb; }
      .row { font: 500 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #cbd5e1; }
      .muted { fill: #94a3b8; }
      .edge { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .pill { fill: #1d4ed8; }
      .pill2 { fill: #059669; }
      .pillText { font: 700 10px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #fff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="420" rx="18"/>
  <text class="title" x="28" y="44">Supabase — tables minimales</text>

  <!-- clients table -->
  <g>
    <rect class="card" x="70" y="90" width="440" height="260" rx="14"/>
    <rect class="head" x="70" y="90" width="440" height="54" rx="14"/>
    <text class="htext" x="92" y="124">clients</text>
    <rect class="pill2" x="160" y="106" width="70" height="20" rx="10"/>
    <text class="pillText" x="172" y="120">lookup</text>

    <text class="row" x="92" y="170"><tspan class="muted">id</tspan> uuid (PK)</text>
    <text class="row" x="92" y="196"><tspan class="muted">telegram_chat_id</tspan> bigint (unique)</text>
    <text class="row" x="92" y="222"><tspan class="muted">name</tspan> text</text>
    <text class="row" x="92" y="248"><tspan class="muted">email</tspan> text</text>
    <text class="row" x="92" y="274"><tspan class="muted">tier</tspan> text (standard|premium)</text>
    <text class="row" x="92" y="300"><tspan class="muted">created_at</tspan> timestamptz</text>
  </g>

  <!-- tickets table -->
  <g>
    <rect class="card" x="690" y="90" width="440" height="260" rx="14"/>
    <rect class="head" x="690" y="90" width="440" height="54" rx="14"/>
    <text class="htext" x="712" y="124">tickets</text>
    <rect class="pill" x="780" y="106" width="84" height="20" rx="10"/>
    <text class="pillText" x="792" y="120">audit log</text>

    <text class="row" x="712" y="170"><tspan class="muted">id</tspan> uuid (PK)</text>
    <text class="row" x="712" y="196"><tspan class="muted">correlation_id</tspan> text</text>
    <text class="row" x="712" y="222"><tspan class="muted">chat_id</tspan> bigint</text>
    <text class="row" x="712" y="248"><tspan class="muted">category</tspan> text</text>
    <text class="row" x="712" y="274"><tspan class="muted">priority</tspan> text</text>
    <text class="row" x="712" y="300"><tspan class="muted">action</tspan> text (auto_reply|escalate)</text>
    <text class="row" x="712" y="326"><tspan class="muted">message / reply / reasoning_summary</tspan></text>
  </g>

  <!-- relationship -->
  <path class="edge" d="M510 220 C 600 220, 600 220, 690 220"/>
  <text class="row" x="542" y="206">clients.telegram_chat_id ≈ tickets.chat_id</text>
</svg>
