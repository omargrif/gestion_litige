<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Audio branch">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .title { font: 700 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #e5e7eb; }
      .node { fill: #111827; stroke: #334155; stroke-width: 1.2; }
      .label { font: 650 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #e5e7eb; }
      .small { font: 500 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #cbd5e1; }
      .edge { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .badge { fill: #a855f7; }
      .badgeText { font: 700 11px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #fff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="300" rx="18"/>
  <text class="title" x="28" y="44">Branche AUDIO</text>

  <g>
    <rect class="node" x="60" y="120" width="220" height="70" rx="12"/>
    <rect class="badge" x="72" y="132" width="56" height="20" rx="10"/>
    <text class="badgeText" x="84" y="147">AUDIO</text>
    <text class="label" x="140" y="148">Telegram getFile</text>
    <text class="small" x="140" y="168">file_id (audio_file_id)</text>
  </g>

  <g>
    <rect class="node" x="320" y="120" width="220" height="70" rx="12"/>
    <text class="label" x="340" y="148">Download binary</text>
    <text class="small" x="340" y="168">GET file_path → binary</text>
  </g>

  <g>
    <rect class="node" x="580" y="120" width="240" height="70" rx="12"/>
    <text class="label" x="600" y="148">Transcription</text>
    <text class="small" x="600" y="168">Groq Whisper (FR) → text</text>
  </g>

  <g>
    <rect class="node" x="860" y="120" width="280" height="70" rx="12"/>
    <text class="label" x="880" y="148">Parse</text>
    <text class="small" x="880" y="168">content = transcription text</text>
  </g>

  <path class="edge" d="M280 155 L320 155"/>
  <path class="edge" d="M540 155 L580 155"/>
  <path class="edge" d="M820 155 L860 155"/>

  <text class="small" x="60" y="238">Ensuite: merge logique → Supabase (client) → Decision LLM → Switch Action</text>
</svg>
