<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d4bf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b6df5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon -->
  <g>
    <!-- Solar panels on car (represented by grid) -->
    <rect x="8" y="20" width="24" height="20" fill="none" stroke="url(#logoGradient)" stroke-width="2" rx="3"/>
    
    <!-- Solar panel cells -->
    <g stroke="url(#logoGradient)" stroke-width="0.8" opacity="0.7">
      <line x1="12" y1="20" x2="12" y2="40"/>
      <line x1="16" y1="20" x2="16" y2="40"/>
      <line x1="20" y1="20" x2="20" y2="40"/>
      <line x1="24" y1="20" x2="24" y2="40"/>
      <line x1="8" y1="25" x2="32" y2="25"/>
      <line x1="8" y1="30" x2="32" y2="30"/>
      <line x1="8" y1="35" x2="32" y2="35"/>
    </g>
    
    <!-- Car silhouette -->
    <g fill="url(#logoGradient)">
      <ellipse cx="20" cy="42" rx="16" ry="5" opacity="0.8"/>
      <path d="M 10 42 L 12 35 L 28 35 L 30 42" fill="url(#logoGradient)" opacity="0.6"/>
    </g>
    
    <!-- Sun/Energy indicator -->
    <circle cx="28" cy="15" r="6" fill="url(#logoGradient)" opacity="0.8"/>
    <g stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.6" stroke-linecap="round">
      <line x1="28" y1="6" x2="28" y2="3"/>
      <line x1="35" y1="15" x2="38" y2="15"/>
      <line x1="32" y1="9" x2="34" y2="7"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="42" y="38" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="url(#logoGradient)" letter-spacing="2">
    Auto
  </text>
  <text x="42" y="52" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#6d4bf4" opacity="0.7" letter-spacing="1">
    SOLAR MOBILITY
  </text>
</svg>