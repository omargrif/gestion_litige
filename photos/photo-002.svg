<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7f6fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skinTone1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c89968;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skinTone2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4c4a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8b4a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skinTone3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a275;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b89468;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGradient)"/>

  <!-- Whiteboard/Tableau blanc -->
  <rect x="600" y="80" width="340" height="400" fill="#ffffff" rx="8" box-shadow="0 8px 24px rgba(0,0,0,0.1)"/>
  <rect x="610" y="90" width="320" height="380" fill="#fafafa" rx="4"/>

  <!-- Whiteboard elements -->
  <!-- Graphique/Chart -->
  <g>
    <rect x="620" y="100" width="70" height="90" fill="none" stroke="#4a90a4" stroke-width="2" opacity="0.3"/>
    <rect x="625" y="160" width="8" height="30" fill="#4a90a4" opacity="0.6"/>
    <rect x="636" y="145" width="8" height="45" fill="#5fa3b8" opacity="0.6"/>
    <rect x="647" y="130" width="8" height="60" fill="#6db5ce" opacity="0.6"/>
    <rect x="658" y="150" width="8" height="40" fill="#4a90a4" opacity="0.6"/>
  </g>

  <!-- Notes et diagrammes -->
  <g stroke="#d4a574" stroke-width="2" fill="none" opacity="0.4">
    <circle cx="720" cy="130" r="25"/>
    <line x1="720" y1="105" x2="720" y2="155"/>
    <line x1="695" y1="130" x2="745" y2="130"/>
  </g>

  <!-- Lignes de texte (tableau) -->
  <line x1="620" y1="210" x2="930" y2="210" stroke="#b0b0b0" stroke-width="1.5" opacity="0.5"/>
  <line x1="620" y1="230" x2="900" y2="230" stroke="#b0b0b0" stroke-width="1.5" opacity="0.5"/>
  <line x1="620" y1="250" x2="920" y2="250" stroke="#b0b0b0" stroke-width="1.5" opacity="0.5"/>
  <line x1="620" y1="270" x2="880" y2="270" stroke="#b0b0b0" stroke-width="1.5" opacity="0.5"/>

  <!-- Graphique courbe -->
  <path d="M 720 320 Q 750 300 780 290" stroke="#6db5ce" stroke-width="3" fill="none" opacity="0.6"/>
  <circle cx="780" cy="290" r="4" fill="#6db5ce" opacity="0.8"/>

  <!-- Icones post-it -->
  <g opacity="0.4">
    <rect x="800" y="340" width="20" height="20" fill="#ffd700" transform="rotate(15 810 350)"/>
    <rect x="830" y="355" width="20" height="20" fill="#ff9999" transform="rotate(-20 840 365)"/>
    <rect x="860" y="340" width="20" height="20" fill="#99ccff" transform="rotate(10 870 350)"/>
  </g>

  <!-- Persone 1 - Gauche -->
  <g>
    <circle cx="120" cy="150" r="35" fill="url(#skinTone1)"/>
    <path d="M 90 185 Q 90 210 120 220 Q 150 210 150 185" fill="url(#skinTone1)"/>
    <rect x="95" y="220" width="25" height="80" fill="#5fa3b8" rx="4"/>
    <rect x="130" y="220" width="25" height="80" fill="#5fa3b8" rx="4"/>
    <path d="M 95 300 Q 95 330 105 345" fill="#6b7280" stroke="#6b7280" stroke-width="3"/>
    <path d="M 145 300 Q 145 330 135 345" fill="#6b7280" stroke="#6b7280" stroke-width="3"/>
    <!-- cheveux -->
    <path d="M 85 140 Q 85 115 120 110 Q 155 115 155 140" fill="#2d2d2d"/>
    <!-- yeux -->
    <circle cx="105" cy="145" r="3" fill="#1f2430"/>
    <circle cx="135" cy="145" r="3" fill="#1f2430"/>
  </g>

  <!-- Persone 2 - Gauche-Haut -->
  <g>
    <circle cx="220" cy="120" r="35" fill="url(#skinTone2)"/>
    <path d="M 190 155 Q 190 180 220 190 Q 250 180 250 155" fill="url(#skinTone2)"/>
    <rect x="195" y="190" width="20" height="85" fill="#f5e6d3" rx="3"/>
    <rect x="225" y="190" width="20" height="85" fill="#f5e6d3" rx="3"/>
    <path d="M 195 275 Q 195 305 205 320" fill="#6b7280" stroke="#6b7280" stroke-width="3"/>
    <path d="M 245 275 Q 245 305 235 320" fill="#6b7280" stroke="#6b7280" stroke-width="3"/>
    <!-- cheveux longs -->
    <path d="M 185 110 Q 185 90 220 85 Q 255 90 255 110 Q 255 125 240 130" fill="#5c3d2e"/>
    <!-- yeux -->
    <circle cx="205" cy="115" r="3" fill="#1f2430"/>
    <circle cx="235" cy="115" r="3" fill="#1f2430"/>
  </g>

  <!-- Persone 3 - Haut centre -->
  <g>
    <circle cx="330" cy="100" r="35" fill="url(#skinTone3)"/>
    <path d="M 300 135 Q 300 160 330 170 Q 360 160 360 135" fill="url(#skinTone3)"/>
    <rect x="305" y="170" width="20" height="85" fill="#d4a574" rx="3"/>
    <rect x="335" y="170" width="20" height="85" fill="#d4a574" rx="3"/>
    <path d="M 305 255 Q 305 285 315 300" fill="#6b7280" stroke="#6b7280" stroke-width="3"/>
    <path d="M 355 255 Q 355 285 345 300" fill="#6b7280" stroke="#6b7280" stroke-width="3"/>
    <!-- cheveux -->
    <path d="M 295 90 Q 295 65 330 60 Q 365 65 365 90" fill="#3d2817"/>
    <!-- yeux -->
    <circle cx="315" cy="95" r="3" fill="#1f2430"/>
    <circle cx="345" cy="95" r="3" fill="#1f2430"/>
  </g>

  <!-- Persone 4 - Droite-Haut -->
  <g>
    <circle cx="440" cy="120" r="35" fill="url(#skinTone1)"/>
    <path d="M 410 155 Q 410 180 440 190 Q 470 180 470 155" fill="url(#skinTone1)"/>
    <rect x="415" y="190" width="20" height="85" fill="#9db4c4" rx="3"/>
    <rect x="445" y="190" width="20" height="85" fill="#9db4c4" rx="3"/>
    <path d="M 415 275 Q 415 305 425 320" fill="#6b7280" stroke="#6b7280" stroke-width="3"/>
    <path d="M 465 275 Q 465 305 455 320" fill="#6b7280" stroke="#6b7280" stroke-width="3"/>
    <!-- cheveux -->
    <path d="M 405 110 Q 405 85 440 80 Q 475 85 475 110" fill="#4a4a4a"/>
    <!-- yeux -->
    <circle cx="425" cy="115" r="3" fill="#1f2430"/>
    <circle cx="455" cy="115" r="3" fill="#1f2430"/>
  </g>

  <!-- Persone 5 - Droite -->
  <g>
    <circle cx="530" cy="150" r="35" fill="url(#skinTone2)"/>
    <path d="M 500 185 Q 500 210 530 220 Q 560 210 560 185" fill="url(#skinTone2)"/>
    <rect x="505" y="220" width="25" height="80" fill="#c4b5a0" rx="4"/>
    <rect x="540" y="220" width="25" height="80" fill="#c4b5a0" rx="4"/>
    <path d="M 505 300 Q 505 330 515 345" fill="#6b7280" stroke="#6b7280" stroke-width="3"/>
    <path d="M 555 300 Q 555 330 545 345" fill="#6b7280" stroke="#6b7280" stroke-width="3"/>
    <!-- cheveux -->
    <path d="M 495 140 Q 495 115 530 110 Q 565 115 565 140" fill="#2d2d2d"/>
    <!-- yeux -->
    <circle cx="515" cy="145" r="3" fill="#1f2430"/>
    <circle cx="545" cy="145" r="3" fill="#1f2430"/>
  </g>

  <!-- Centre bas - Persone 6 (tableau de bord) -->
  <g>
    <circle cx="320" cy="380" r="35" fill="url(#skinTone3)"/>
    <path d="M 290 415 Q 290 440 320 450 Q 350 440 350 415" fill="url(#skinTone3)"/>
    <rect x="295" y="450" width="20" height="80" fill="#7a9aaa" rx="3"/>
    <rect x="325" y="450" width="20" height="80" fill="#7a9aaa" rx="3"/>
    <path d="M 295 530 Q 295 560 305 575" fill="#6b7280" stroke="#6b7280" stroke-width="3"/>
    <path d="M 345 530 Q 345 560 335 575" fill="#6b7280" stroke="#6b7280" stroke-width="3"/>
    <!-- cheveux -->
    <path d="M 285 370 Q 285 345 320 340 Q 355 345 355 370" fill="#5c3d2e"/>
    <!-- yeux -->
    <circle cx="305" cy="375" r="3" fill="#1f2430"/>
    <circle cx="335" cy="375" r="3" fill="#1f2430"/>
  </g>

  <!-- Lignes de connexion (energie/collaboration) -->
  <g stroke="#6d4bf4" stroke-width="1.5" opacity="0.15" stroke-dasharray="4,4">
    <line x1="155" y1="220" x2="320" y2="380"/>
    <line x1="255" y1="190" x2="320" y2="380"/>
    <line x1="365" y1="170" x2="320" y2="380"/>
    <line x1="475" y1="190" x2="320" y2="380"/>
    <line x1="505" y1="220" x2="320" y2="380"/>
  </g>

  <!-- Bulles de chat légères -->
  <g opacity="0.2">
    <rect x="170" y="280" width="60" height="35" rx="8" fill="none" stroke="#6d4bf4" stroke-width="1.5"/>
    <polygon points="175,315 165,325 185,320" fill="#6d4bf4"/>
    
    <rect x="420" y="300" width="60" height="35" rx="8" fill="none" stroke="#3b6df5" stroke-width="1.5"/>
    <polygon points="475,335 485,325 465,330" fill="#3b6df5"/>
  </g>

  <!-- Éléments de light décor -->
  <circle cx="80" cy="80" r="4" fill="#ffd700" opacity="0.3"/>
  <circle cx="900" cy="150" r="3" fill="#6d4bf4" opacity="0.2"/>
  <circle cx="950" cy="500" r="5" fill="#3b6df5" opacity="0.25"/>
  <circle cx="100" cy="500" r="4" fill="#ffd700" opacity="0.2"/>
</svg>